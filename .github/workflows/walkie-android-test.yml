name: Walkie Talkie Android test APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: walkie-android-test
  cancel-in-progress: false

jobs:
  apk:
    if: github.repository == 'BitcoinWalk/walkie-talkie'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_APP_ENV: development
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install native toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'cmake;3.22.1' 'ndk;27.1.12297006'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx patch-package --error-on-fail
      - name: Check application and walk feed
        run: |
          node --test tests/bitcoinwalk/core.test.mjs
          npx jest src/services/bitcoinwalk/__tests__/walks.test.ts --runInBand
          npx tsc --noEmit
      - name: Generate isolated development app
        run: |
          npx expo prebuild --platform android --no-install
          grep -q "applicationId 'org.bitcoinwalk.walkietalkie.dev'" android/app/build.gradle
      - name: Build standalone test APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a -PreactNativeDevServerIp=127.0.0.1
      - name: Verify and label test artifact
        run: |
          mkdir -p test-artifact
          cp android/app/build/outputs/apk/release/app-release.apk test-artifact/WalkieTalkie-test-arm64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs test-artifact/WalkieTalkie-test-arm64.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging test-artifact/WalkieTalkie-test-arm64.apk | head -1 | grep "name='org.bitcoinwalk.walkietalkie.dev'"
          cd test-artifact
          sha256sum WalkieTalkie-test-arm64.apk > SHA256SUMS
          printf '%s\n' "Commit: $GITHUB_SHA" 'TEST ONLY: arm64 Android, development identity, debug signing certificate.' 'No production accounts, private keys or funded wallets. Not a Zapstore release.' > BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WalkieTalkie-test-arm64-${{ github.run_number }}
          path: test-artifact/
          if-no-files-found: error
          retention-days: 14
