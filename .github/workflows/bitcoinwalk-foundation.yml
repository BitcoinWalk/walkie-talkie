name: Walkie Talkie foundation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/bitcoinwalk/core.test.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx patch-package --error-on-fail
      - run: npx jest src/services/bitcoinwalk/__tests__/walks.test.ts --runInBand
      - run: npx tsc --noEmit
