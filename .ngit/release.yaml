name: Walkie Talkie
summary: BitcoinWalk's Nostr companion for local walks and community chat.
description: |
  Browse BitcoinWalk cities, keep your chosen city as your home screen, and
  join its NIP-29 community chat. Walkie Talkie also includes BitcoinWalk
  Global, private host coordination, NIP-17 direct messages, walk invites,
  and optional Lightning wallet connections. Bluetooth mesh is shown as a
  Coming soon preview and does not start radio activity in this release.
tags: [nostr, bitcoin, social, messaging, community]
license: MIT
website: https://bitcoinwalk.org
repository: nostr://npub1jr8sgwrpuk66n9evk76jnfd6wxept4k3uv2vwjw42fhvzvl3mdes38wwnw/relay.ngit.dev/walkie-talkie
icon: fastlane/metadata/android/en-US/images/icon.png
notes: |
  - Fix Amber and other NIP-46 bunker sign-in when Android briefly reports Walkie Talkie offline while the signer is open.
  - Preserve the active signing reply subscription and recover cleanly when returning from the signer.
  - Browse BitcoinWalk cities before signing in and keep your selected city as the home screen.
  - Open distinct City and Global conversations, with the private Hosts group limited to organizers.
  - Sign in with a local key, Amber, or a remote signer.
  - Route Amber and other Nostr Connect sign-ins through BitcoinWalk's dedicated ephemeral relay.
  - Skip the upstream psstpsst.chat identifier claim when creating a BitcoinWalk account.
  - Recover bunker login after an Amber approval reply is lost while switching apps.
  - Refresh Android connectivity after returning from Amber so a stale offline hint cannot block the signer relay.
  - Fixed Android cold-start city recovery and remote-signer reconnection.
  - Added the app version to the loading screen.
  - Refresh the city mosaic from BitcoinWalk whenever it opens.
  - Keep the newest group messages visible above the keyboard and composer using an Android-safe measured footer.
  - Mention people in community chats and receive local notifications with per-room mute controls.
  - Show current NIP-05 verification on profiles.
  - Keep Bluetooth mesh parked behind a Coming soon screen without requesting permissions or starting radio activity.
release_source: release/zapstore/WalkieTalkie-{version}-android.apk
publication:
  zapstore_relay: true
  strict_metadata: true
